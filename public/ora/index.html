<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Ora — Shift &amp; Earnings Tracker</title>
<meta name="description" content="Ora is a calm shift and earnings tracker for iPhone and iPad. One-time purchase, no subscription, no ads, no tracking.">
<style>
  :root { --paper:#F4F3EF; --ink:#1B1E1C; --muted:#5C635D; --faint:#8A908A; --accent:#1F5C3D; --line:#E4E2DB; }
  * { box-sizing:border-box; }
  body { margin:0; background:var(--paper); color:var(--ink); text-align:center;
    font:17px/1.6 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif; }
  .wrap { max-width:560px; margin:0 auto; padding:14vh 24px 96px; }
  .mark { width:84px; height:84px; border-radius:20px; background:var(--accent); display:inline-flex;
    align-items:center; justify-content:center; margin-bottom:1.5rem; }
  .mark span { font-family:Georgia,serif; color:#F4F3EF; font-size:2.6rem; }
  h1 { font-family:Georgia,"Times New Roman",serif; font-size:2.4rem; margin:0 0 .4rem; letter-spacing:-.01em; }
  p.tag { color:var(--muted); font-size:1.1rem; margin:0 auto 2.4rem; max-width:34ch; }
  .links a { display:inline-block; color:var(--accent); text-decoration:none; margin:0 .6rem;
    border-bottom:1px solid var(--line); padding-bottom:2px; }
  .links a:hover { border-color:var(--accent); }
  footer { margin-top:3rem; color:var(--faint); font-size:.9rem; }
</style>
</head>
<body>
<main class="wrap">
  <div class="mark"><span>O</span></div>
  <h1>Ora</h1>
  <p class="tag">A calm shift &amp; earnings tracker for iPhone and iPad. Get the overnight and overtime math
  right, and always know what you've earned. One price, once. No subscription.</p>
  <p class="links">
    <a href="/ora/support/">Support</a>
    <a href="/ora/privacy/">Privacy</a>
    <a href="mailto:support@selora.dev">Contact</a>
  </p>
  <footer>Selora · Ora</footer>
</main>
</body>
</html>
